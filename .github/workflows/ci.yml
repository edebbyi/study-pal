name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: |
          mypy \
            src/core/config.py \
            src/api/models.py \
            src/publishing/schemas.py \
            src/api/services/request_identity.py \
            src/api/services/rate_limit.py
      - name: Publishing/API smoke tests
        run: |
          pytest -q \
            tests/test_api_smoke.py \
            tests/test_document_qa.py \
            tests/test_observability_health_modes.py \
            tests/test_observability_redaction.py \
            tests/test_rate_limit.py \
            tests/test_request_identity.py
      - name: Full test suite
        run: pytest
